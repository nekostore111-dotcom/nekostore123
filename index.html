<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEKO STORE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #10131c;
            color: white;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(16, 19, 28, 0.6);
            z-index: -1;
        }

        /* Снег */
        #snow-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        header {
            background: rgba(27, 32, 48, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0; z-index: 50;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        header h1 { color: #5795ff; font-size: 26px; letter-spacing: 2px; font-weight: 900; text-transform: uppercase; }
        
        nav { display: flex; align-items: center; gap: 20px; }
        nav a { color: #d0d6e2; text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: #5795ff; }
        
        #cart-btn { 
            background: rgba(37, 43, 61, 0.8); padding: 8px 16px; border-radius: 20px;
            border: 1px solid #5795ff; color: #fff; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 15px;
        }
        #cart-btn:hover { background: #5795ff; color: #10131c; }

        main { 
            flex: 1; padding: 40px 20px 80px; text-align: center; 
            max-width: 1100px; margin: 0 auto; width: 100%; 
            position: relative; z-index: 3; 
        }
        
        main > h2 { font-size: 34px; margin-bottom: 40px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); font-weight: 900; }
        
        #products { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 30px; margin-top: 20px; 
        }
        
        /* Карточка с 3D-эффектом и свечением */
        .product {
            background: rgba(35, 40, 58, 0.8); backdrop-filter: blur(10px); 
            padding: 30px 20px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex; flex-direction: column; justify-content: space-between;
            text-align: center; 
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.1s ease-out;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            will-change: transform;
        }
        
        .product:hover { 
            border-color: #5795ff; 
            box-shadow: 0 15px 40px rgba(87, 149, 255, 0.3); 
        }

        /* Светящееся пятно внутри карточки за мышкой */
        .product::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(87, 149, 255, 0.2) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .product:hover::before { opacity: 1; }

        .product h3 { font-size: 20px; margin-bottom: 10px; font-weight: 700; position: relative; z-index: 2; }
        .price { color: #5795ff; font-size: 28px; font-weight: 900; margin-bottom: 20px; position: relative; z-index: 2; }
        
        .buy-button {
            padding: 14px 24px; background: rgba(87, 149, 255, 0.1); color: #5795ff; 
            border: 2px solid #5795ff; border-radius: 12px; font-size: 16px; 
            font-weight: 700; cursor: pointer; transition: all 0.3s ease; 
            font-family: 'Montserrat', sans-serif;
            position: relative; z-index: 2;
        }
        
        .buy-button:hover { 
            background: #5795ff; color: white; box-shadow: 0 0 20px rgba(87, 149, 255, 0.6);
        }

        /* Корзина */
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 90; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .cart-overlay.active { opacity: 1; visibility: visible; }

        .cart-sidebar {
            position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100%;
            background: #1b2030; border-left: 1px solid #2f3a55; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 95; display: flex; flex-direction: column; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-sidebar.active { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid #2f3a55; display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { font-size: 22px; color: #5795ff; margin: 0; font-weight: 900; }
        .cart-body { flex: 1; padding: 20px; overflow-y: auto; }
        #cart-list { list-style: none; padding: 0; margin: 0; }
        #cart-list li { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(47, 58, 85, 0.5); }
        .cart-footer { padding: 20px; border-top: 1px solid #2f3a55; background: #1b2030; }
        .cart-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .cart-total span:last-child { color: #5795ff; font-weight: 900; }
        .cart-actions { display: flex; flex-direction: column; gap: 10px; }
        .checkout-btn { display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; padding: 15px; background: linear-gradient(135deg, #29b6f6, #0288d1); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 15px rgba(41, 182, 246, 0.3); font-family: 'Montserrat', sans-serif; }
        .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(41, 182, 246, 0.5); }
        .remove-item { background: none; border: none; color: #f44336; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .remove-item:hover { color: #d32f2f; transform: scale(1.2); }
        
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #b7bfd0; background: none; border: none; }

        footer { background: transparent; backdrop-filter: blur(5px); padding: 30px 20px; text-align: center; border-top: 1px solid rgba(87, 149, 255, 0.3); margin-top: auto; position: relative; z-index: 3; }
        footer p { color: #b7bfd0; font-size: 15px; margin-bottom: 15px; font-weight: 400; }
        .social-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .social-links a { display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; background: rgba(27, 32, 48, 0.8); color: #d0d6e2; text-decoration: none; border-radius: 14px; font-size: 22px; border: 1px solid #2f3a55; transition: all 0.3s ease; }
        .social-links a.tg:hover { background: #29b6f6; color: white; border-color: #29b6f6; transform: translateY(-3px); }
        .social-links a.vk:hover { background: #4a76a8; color: white; border-color: #4a76a8; transform: translateY(-3px); }

        @media (max-width: 800px) { header { flex-direction: column; gap: 15px; } nav { flex-wrap: wrap; justify-content: center; } }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <header>
        <h1>NEKO STORE</h1>
        <nav>
            <a href="#">Главная</a>
            <a href="#">Каталог</a>
            <button id="cart-btn">Корзина 🛒 (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <main>
        <h2>Наши товары</h2>
        <section id="products"></section>
    </main>

    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Корзина</h2>
            <button class="close-btn" id="close-cart">&times;</button>
        </div>
        <div class="cart-body">
            <ul id="cart-list"></ul>
        </div>
        <div class="cart-footer">
            <div class="cart-total">Итого: <span id="cart-total-price">0 ₽</span></div>
            <div class="cart-actions">
                <a href="#" id="tg-checkout-link" class="checkout-btn" target="_blank">
                    <i class="fa-brands fa-telegram"></i> Заказать в Telegram
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 NEKO STORE. Мои соцсети:</p>
        <div class="social-links">
            <a href="https://t.me/uygix" target="_blank" class="tg"><i class="fa-brands fa-telegram"></i></a>
            <a href="#" target="_blank" class="vk"><i class="fa-brands fa-vk"></i></a>
        </div>
    </footer>

    <script>
        localStorage.clear(); // Очистка старых данных

        // --- СНЕГ ---
        const snowCanvas = document.getElementById('snow-canvas');
        const sCtx = snowCanvas.getContext('2d');
        let sWidth = snowCanvas.width = window.innerWidth;
        let sHeight = snowCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            sWidth = snowCanvas.width = window.innerWidth;
            sHeight = snowCanvas.height = window.innerHeight;
        });

        const snowflakes = [];
        for (let i = 0; i < 150; i++) {
            snowflakes.push({
                x: Math.random() * sWidth, y: Math.random() * sHeight,
                radius: Math.random() * 2 + 1, speedY: Math.random() * 1 + 0.5, speedX: Math.random() * 1 - 0.5
            });
        }

        function drawSnow() {
            sCtx.clearRect(0, 0, sWidth, sHeight);
            sCtx.fillStyle = "rgba(255, 255, 255, 0.8)";
            sCtx.beginPath();
            for (let i = 0; i < snowflakes.length; i++) {
                const flake = snowflakes[i];
                sCtx.moveTo(flake.x, flake.y); sCtx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                flake.y += flake.speedY; flake.x += flake.speedX;
                if (flake.y > sHeight) { flake.y = -10; flake.x = Math.random() * sWidth; }
            }
            sCtx.fill(); requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // --- МАГАЗИН ---
        const telegramUsername = "uygix"; 
        const productsContainer = document.getElementById("products");

        const defaultProducts = [
            { name: "Номер +7 (Казахстан)", price: 350 },
            { name: "Номер +1 (США/Канада)", price: 99 },
            { name: "Номер +880 (Бангладеш)", price: 99 },
            { name: "Номер +57 (Колумбия)", price: 110 },
            { name: "Номер +95 (Мьянма)", price: 130 },
            { name: "Номер +48 (Польша)", price: 300 },
            { name: "Номер +998 (Узбекистан)", price: 250 },
            { name: "Номер +91 (Индия)", price: 150 },
            { name: "Номер +67 (Малайзия)", price: 250 },
            { name: "Номер +375 (Беларусь)", price: 850 },
            { name: "Номер +380 (Украина)", price: 400 },
            { name: "Номер +33 (Франция)", price: 300 },
            { name: "Номер +81 (Япония)", price: 250 }
        ];

        defaultProducts.forEach(product => {
            const div = document.createElement("div");
            div.className = "product";
            div.innerHTML = `
                <h3>${product.name}</h3>
                <p class="price">${product.price} ₽</p>
                <button class="buy-button" data-name="${product.name}" data-price="${product.price}">Купить</button>
            `;
            productsContainer.appendChild(div);
        });

        // --- 3D-ЭФФЕКТ И СВЕЧЕНИЕ НА КАРТОЧКАХ ---
        document.querySelectorAll('.product').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -10; 
                const rotateY = ((x - centerX) / centerX) * 10;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale(1)`;
            });
        });

        // --- КОРЗИНА ---
        let cart = [];
        const cartBtn = document.getElementById("cart-btn");
        const cartSidebar = document.getElementById("cart-sidebar");
        const cartOverlay = document.getElementById("cart-overlay");
        const closeCartBtn = document.getElementById("close-cart");
        const cartList = document.getElementById("cart-list");
        const cartCountElement = document.getElementById("cart-count");
        const cartTotalPrice = document.getElementById("cart-total-price");
        const tgCheckoutLink = document.getElementById("tg-checkout-link");

        function openCart() { cartSidebar.classList.add("active"); cartOverlay.classList.add("active"); }
        function closeCart() { cartSidebar.classList.remove("active"); cartOverlay.classList.remove("active"); }

        function updateCartUI() {
            cartCountElement.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartList.innerHTML = "";

            if (cart.length === 0) {
                cartList.innerHTML = "<li style='justify-content: center; color: #888; padding: 20px 0;'>Корзина пуста</li>";
                cartTotalPrice.textContent = "0 ₽"; tgCheckoutLink.style.display = "none"; return;
            }

            tgCheckoutLink.style.display = "flex"; let total = 0;
            cart.forEach((item, index) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <div>
                        <span style="display: block; font-weight: 700; margin-bottom: 5px;">${item.name}</span>
                        <span style="color: #888; font-size: 14px;">${item.quantity} шт. × ${item.price} ₽</span>
                    </div>
                    <div>
                        <span style="font-weight: 700; color: #5795ff; margin-right: 10px;">${item.price * item.quantity} ₽</span>
                        <button class="remove-item" data-index="${index}"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                cartList.appendChild(li); total += item.price * item.quantity;
            });

            cartTotalPrice.textContent = total + " ₽";
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', function() { cart.splice(Number(this.dataset.index), 1); updateCartUI(); });
            });
        }

        document.querySelectorAll(".buy-button").forEach(function (button) {
            button.addEventListener("click", function () {
                const name = button.dataset.name; const price = Number(button.dataset.price);
                const existingItem = cart.find(item => item.name === name);
                if (existingItem) { existingItem.quantity += 1; } else { cart.push({ name, price, quantity: 1 }); }
                updateCartUI(); openCart(); 
            });
        });

        cartBtn.addEventListener("click", openCart); closeCartBtn.addEventListener("click", closeCart);
        cartOverlay.addEventListener("click", closeCart);

        tgCheckoutLink.addEventListener("click", function (e) {
            if (cart.length === 0) { e.preventDefault(); return; }
            let namesArray = cart.map(item => item.name);
            let message = `Привет! Я по поводу ${namesArray.join(', ')}`;
            this.href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
            setTimeout(() => { cart = []; updateCartUI(); closeCart(); }, 100);
        });
    </script>
</body>
</html>
